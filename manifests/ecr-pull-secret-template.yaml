# NOT applied automatically by ArgoCD - this is a reference/template.
#
# Unlike Docker Hub (where a long-lived token works), ECR auth tokens
# expire every 12 hours. If you switch the deployment.yaml image to an
# ECR URI, your pods will start getting ImagePullBackOff after 12hrs
# unless this secret is refreshed. This is intentional - it's one of
# the troubleshooting scenarios in Pillar 6.
#
# To generate/refresh manually on EC2-2 (until you automate it):
#   kubectl create secret docker-registry ecr-pull-secret \
#     --docker-server=<account-id>.dkr.ecr.<region>.amazonaws.com \
#     --docker-username=AWS \
#     --docker-password=$(aws ecr get-login-password --region <region>) \
#     --namespace=default \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Then reference it in deployment.yaml under spec.template.spec:
#   imagePullSecrets:
#     - name: ecr-pull-secret
