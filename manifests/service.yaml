apiVersion: v1
kind: Service
metadata:
  name: jenkins-argocd-app
  namespace: default
spec:
  type: NodePort
  selector:
    app: jenkins-argocd-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080   # Access via <EC2-2-public-ip>:30080 -- remember to open this in your Security Group
